# docker-compose.yml
# MongoDB 8
# https://hub.docker.com/_/mongo
# https://hub.docker.com/_/adminer
# Start:
# docker compose up -d
# Stop:
# docker compose down
# Logs:
# docker compose logs -f
services:
  mongodb:
    image: mongo:8-noble
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    entrypoint: ["/bin/sh", "/usr/local/bin/prepare-container.sh"]
    tmpfs:
      - /etc/ssl/mongodb:mode=0700
    command:
      - 'mongod'
      - '--auth'
      - '--config'
      - '/etc/mongo/mongod.conf'
    volumes:
      - mongo:/data/db
      - mongo_logs:/var/log/mongodb
      - ../mongod.conf:/etc/mongo/mongod.conf:ro
      - ./container-entrypoint.sh:/usr/local/bin/prepare-container.sh:ro
      - type: bind
        source: ./ssl
        target: /run/tls-source
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:27017:27017"

volumes:
  mongo_logs:
  mongo:
  
