# ===============================
# PostgreSQL 18.6 - Sample postgresql.conf (Windows)
# Secure local baseline
# ===============================

# --- Files and connections ---
data_directory = 'C:/Program Files/PostgreSQL/18/data'
hba_file = 'C:/Program Files/PostgreSQL/18/data/pg_hba.conf'
ident_file = 'C:/Program Files/PostgreSQL/18/data/pg_ident.conf'
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 100

# --- Authentication & password handling ---
password_encryption = 'scram-sha-256'

# --- TLS/SSL ---
# Enable before allowing remote connections. Keep private keys readable only by
# the PostgreSQL service account.
ssl = off
# ssl = on
# ssl_cert_file = 'C:/postgresql/ssl/server.crt'
# ssl_key_file = 'C:/postgresql/ssl/server.key'
# ssl_ca_file = 'C:/postgresql/ssl/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# --- Memory & planner basics ---
shared_buffers = '256MB'
effective_cache_size = '1GB'
maintenance_work_mem = '64MB'
work_mem = '8MB'

# --- Durability ---
fsync = on
synchronous_commit = on
full_page_writes = on
wal_level = replica
max_wal_size = '1GB'
min_wal_size = '80MB'
checkpoint_completion_target = 0.9

# --- Logging ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = '1d'
log_rotation_size = '100MB'
log_connections = 'all'
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = '10min'
deadlock_timeout = '1s'
log_min_error_statement = error
log_min_duration_statement = 1000
log_statement = 'ddl'

# --- Runtime safety limits ---
idle_in_transaction_session_timeout = '10min'
# statement_timeout = '5min'
# lock_timeout = '30s'

# --- Locale / time ---
timezone = 'Europe/Berlin'
log_timezone = 'Europe/Berlin'

# --- Observability ---
track_io_timing = on
track_activity_query_size = 2048

# --- Notes ---
# - Keep listen_addresses on localhost unless firewall/VPN rules are in place.
# - Switch pg_hba.conf host entries to hostssl after enabling TLS.
# - Tune memory values per host size and workload before production use.
# - Test backups and restores; consider WAL archiving for point-in-time recovery.
