# PostgreSQL 18.6 - host-based authentication (Windows)
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local TCP connections.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# For controlled remote access:
# 1. Set listen_addresses to a trusted interface or '*'.
# 2. Enable ssl = on in postgresql.conf and place valid certificates.
# 3. Add hostssl rules for explicit trusted networks only.
# hostssl all             all             10.0.0.0/8              scram-sha-256
# hostssl all             all             192.168.0.0/16          scram-sha-256
