# PostgreSQL 18.6 - TLS-enabled overrides (Windows)
#
# Copy this file to the PostgreSQL data directory or adapt the include path.

include 'C:/Program Files/PostgreSQL/18/data/postgresql.conf'

hba_file = 'C:/Program Files/PostgreSQL/18/data/pg_hba-tls.conf'

ssl = on
ssl_cert_file = 'C:/postgresql/ssl/server.crt'
ssl_key_file = 'C:/postgresql/ssl/server.key'
ssl_ca_file = 'C:/postgresql/ssl/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on
