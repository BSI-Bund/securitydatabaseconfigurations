# PostgreSQL 18.6 - TLS-required host-based authentication
#
# TYPE      DATABASE        USER            ADDRESS                 METHOD

# Local Unix socket connections inside the container.
local       all             all                                     scram-sha-256

# TLS connections only. Keep the ranges as narrow as your deployment allows.
hostssl     all             all             127.0.0.1/32            scram-sha-256
hostssl     all             all             ::1/128                 scram-sha-256
hostssl     all             all             10.0.0.0/8              scram-sha-256
hostssl     all             all             172.16.0.0/12           scram-sha-256
hostssl     all             all             192.168.0.0/16          scram-sha-256

# Make accidental non-TLS TCP access explicit.
hostnossl   all             all             0.0.0.0/0               reject
hostnossl   all             all             ::/0                    reject

# Optional mutual TLS:
# Add "clientcert=verify-full" to hostssl rows and issue client certificates
# whose CN matches the PostgreSQL role name, or use pg_ident mappings.
