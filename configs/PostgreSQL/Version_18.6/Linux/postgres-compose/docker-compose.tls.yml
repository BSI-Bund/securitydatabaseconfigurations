# docker-compose.tls.yml
# TLS override for PostgreSQL 18.6.
#
# Generate certificates first:
#   ./scripts/generate-local-tls.sh
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d

services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql-tls.conf"
    volumes:
      - ../postgresql-tls.conf:/etc/postgresql/postgresql-tls.conf:ro
      - ../pg_hba-tls.conf:/etc/postgresql/pg_hba-tls.conf:ro
      - type: bind
        source: ./ssl/server.crt
        target: /etc/postgresql/ssl/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ssl/server.key
        target: /etc/postgresql/ssl/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ssl/ca.crt
        target: /etc/postgresql/ssl/ca.crt
        read_only: true
        bind:
          create_host_path: false

  adminer:
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /etc/adminer/tls/ca.crt
    volumes:
      - ./adminer-tls.php:/var/www/html/plugins-enabled/tls.php:ro
      - type: bind
        source: ./ssl/ca.crt
        target: /etc/adminer/tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
