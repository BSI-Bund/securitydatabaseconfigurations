# PostgreSQL 18.6 - host-based authentication (Linux / Docker)
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local Unix socket connections inside the container.
local   all             all                                     scram-sha-256

# Localhost and common private Docker/network ranges.
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# For TLS-only deployments:
# 1. Set ssl = on in postgresql.conf and mount valid certificates.
# 2. Replace the host lines above with hostssl entries.
# hostssl all             all             10.0.0.0/8              scram-sha-256
# hostssl all             all             172.16.0.0/12           scram-sha-256
# hostssl all             all             192.168.0.0/16          scram-sha-256
