tls:
  certificates:
    - certFile: /certs/local.crt
      keyFile: /certs/local.key

http:
  routers:
    weaviate:
      rule: 'Host(`{{ env "WEAVIATE_DOMAIN" }}`)'
      entryPoints:
        - websecure
      tls: {}
      service: weaviate
      middlewares:
        - secure-headers
  services:
    weaviate:
      loadBalancer:
        servers:
          - url: 'http://weaviate-db-proxy:{{ env "WEAVIATE_PORT" }}'
  middlewares:
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
