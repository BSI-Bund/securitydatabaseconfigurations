[client]
port = 3306                                 # Standard-Port für MariaDB-Client
plugin-dir = "C:/Program Files/MariaDB 11.8/lib/plugin"  # Plugin-Verzeichnis für Erweiterungen
# socket wird unter Windows nicht verwendet

[mysqld]
port = 3306                                 # Standard-Port (0-65535)
basedir = "C:/Program Files/MariaDB 11.8"   # Installationsverzeichnis
datadir = "C:/Program Files/MariaDB 11.8/data"  # Datenverzeichnis
pid-file = "C:/Program Files/MariaDB 11.8/data/mysqld.pid" # Prozess-ID-Datei

### Netzwerk und Sicherheit ###
bind_address      = 127.0.0.1               # Nur lokale Verbindungen (0.0.0.0 = Remote-Zugriff)
skip_networking   = 0                       # TCP/IP aktiviert (1 = komplett deaktiviert)
skip_name_resolve = 1                       # Vermeidet DNS-Lookups, beschleunigt Logins
max_connections   = 200                     # Maximale Anzahl gleichzeitiger Verbindungen
local_infile      = 0                       # Unsicheres LOAD DATA LOCAL deaktivieren
symbolic-links    = 0                       # Symlink-Missbrauch verhindern (unter Windows unkritisch)
#secure_file_priv  = "C:/Program Files/MariaDB 11.8/secure-file"  # Nur hier dürfen Dateien importiert/exportiert werden (Ordner vorher anlegen!)

### Speicher und Performance ###
innodb_buffer_pool_size        = 4G         # 50-80% des RAM (z. B. 4G für 8GB RAM)
innodb_log_file_size           = 256M       # Redo-Log-Größe, je nach Workload anpassen
innodb_file_per_table          = 1          # Separate Dateien pro Tabelle (empfohlen)
innodb_flush_log_at_trx_commit = 1          # Volle ACID-Compliance (2 = schneller, aber weniger sicher)
# innodb_flush_method           = O_DIRECT  # Optional: OS-Cache umgehen (unter Windows meist nicht nötig)

### Zeichensätze ###
character_set_server = utf8mb4              # Standard-Zeichensatz (Unicode)
collation_server     = utf8mb4_general_ci   # Sortierreihenfolge für Zeichensatz

### Protokollierung ###
log_error                   = "C:/Program Files/MariaDB 11.8/data/mysql/error.log"         # Fehlerprotokoll
slow_query_log              = 1                                                           # Slow Query Log aktivieren
slow_query_log_file         = "C:/Program Files/MariaDB 11.8/data/mysql/mysql-slow.log"   # Datei für langsame Abfragen
long_query_time             = 2                                                           # Ab 2 Sekunden gilt eine Abfrage als langsam
log_queries_not_using_indexes = 1                                                         # Protokolliert Abfragen ohne Index
general_log                 = 0                                                           # General Query Log (nur Debugging)
general_log_file            = "C:/Program Files/MariaDB 11.8/data/mysql/mysql-general.log" # Datei für General Query Log

### Binäre Logs (Replikation) ###
log_bin       = "C:/Program Files/MariaDB 11.8/data/mysql-bin.log"                        # Binlog aktivieren (Pfad anpassen)
log_bin_index = "C:/Program Files/MariaDB 11.8/data/mysql-bin.index"                      # Indexdatei für Binärlogs
binlog_format = MIXED                                                                     # ROW/STATEMENT/MIXED (MIXED empfohlen für MariaDB)
sync_binlog   = 1                                                                         # Sichere Synchronisierung (0 = schneller, aber weniger sicher)
expire_logs_days = 10                                                                     # Automatische Bereinigung der Binlogs nach 10 Tagen
# binlog_expire_logs_seconds = 864000                                                     # Alternative Angabe in Sekunden (nicht gleichzeitig!)

### TLS für MariaDB Server aktivieren ###
# Zertifikate müssen vorher erstellt werden, dann Kommentar entfernen und Pfade ggf. anpassen
#ssl-ca   = "C:/mariadb/ssl/ca-cert.pem"     # CA-Zertifikat
#ssl-cert = "C:/mariadb/ssl/server-cert.pem" # Server-Zertifikat
#ssl-key  = "C:/mariadb/ssl/server-key.pem"  # Server-Schlüssel
# TLS-Zwang per SQL: ALTER USER 'app'@'%' REQUIRE SSL;

### TLS für MariaDB Client aktivieren ###
# Optional: Client-Zertifikate für gegenseitige Authentifizierung.
#ssl-ca   = "C:/mariadb/ssl/ca-cert.pem"     # CA-Zertifikat (identisch mit Server)
#ssl-cert = "C:/mariadb/ssl/client-cert.pem" # Client-Zertifikat
#ssl-key  = "C:/mariadb/ssl/client-key.pem"  # Client-Schlüssel
#ssl-verify-server-cert                       # Server-Zertifikat verifizieren (empfohlen)

# MariaDB Dump Einstellungen (nicht für den Server relevant)
[mysqldump]
quick                                      # Schneller Export, Zeile für Zeile
quote-names                                # Sonderzeichen in Backticks setzen
max_allowed_packet = 64M                   # Maximale Paketgröße für große Dumps

# Hinweise:
# - Die Zertifikatsdateien sollten nur für den MariaDB-Benutzer lesbar sein (icacls / chmod 600).
# - Der Common Name (CN) des Server-Zertifikats sollte zum Hostnamen passen.
# - Nach Änderungen an Zertifikaten oder Konfiguration MariaDB neu starten.
# - Für produktive Systeme: Zugriff über eigenen Nutzer (nicht root), starke Passwörter und regelmäßige Backups.
# - Zur Abfrage von Variablen-Werten: SHOW VARIABLES LIKE 'variable_name';
