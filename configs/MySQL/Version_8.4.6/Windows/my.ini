# ============================
# MySQL 8.4.6 (Windows) - my.ini
# Pfade:   C:/Program Files/MySQL/MySQL Server 8.4/
# Logs:    C:/Program Files/MySQL/MySQL Server 8.4/logs/
# Hinweis:
#   - Erzeuge den Ordner "logs" vor dem Start
#   - Dienstkonto muss Schreibrechte haben
#   - Diese Datei gilt nur für MySQL, nicht MariaDB
# Kommandozeile:
# check:  ./mysqld --defaults-file="C:\Program Files\MySQL\MySQL Server 8.4\my.ini"
# execute: cd "C:\Program Files\MySQL\MySQL Server 8.4\bin"
# .\mysqld --defaults-file="C:\Program Files\MySQL\MySQL Server 8.4\my.ini" --console

# ============================

[client]

# pipe=

# socket=MYSQL
# Unter Windows wird kein Socket verwendet - Verbindungen laufen über TCP/IP.
# Clients (z. B. mysql.exe) nutzen diese Standardwerte automatisch.

port=3306


# TLS/SSL für den Client (nur aktivieren, wenn Zertifikate erstellt wurden)
# ssl-ca   = C:/mysql/ssl/ca-cert.pem      # CA-Zertifikat
# ssl-cert = C:/mysql/ssl/client-cert.pem  # Client-Zertifikat
# ssl-key  = C:/mysql/ssl/client-key.pem   # Privater Schlüssel

[mysql]
no-beep

# default-character-set=

# SERVER SECTION

# Port the MySQL Server will listen on
port=3306


[mysqld]
port      = 3306                            # Standard-Port TCP/IP
# basedir="C:/Program Files/MySQL/MySQL Server 8.4"    # Installationsverzeichnis
datadir   = "C:/ProgramData/MySQL/MySQL Server 8.4/Data" # Datenverzeichnis (Tabellen, Logs etc.)

### Netzwerk & Sicherheit ###
bind_address        = 127.0.0.1             # Bindung nur an localhost → sicher (kein Remote-Zugriff)
skip_name_resolve   = 1                     # Verhindert DNS-Lookups, beschleunigt Logins
max_connections     = 200                   # Maximale gleichzeitige Verbindungen
# skip-networking     = 0                   # TCP/IP aktiviert (1 = komplett deaktiviert → nur Named Pipe)
# enable-named-pipe

local_infile        = 0                     # Deaktiviert LOAD DATA LOCAL INFILE (SQL-Injection-Risiko!)
secure-file-priv    = "C:/ProgramData/MySQL/MySQL Server 8.4/Uploads"
# (Optional) Nur dieser Ordner darf für INFILE/OUTFILE genutzt werden
# - Empfehlung: eigenen sicheren Ordner anlegen, dann aktivieren
# Standard-Ordner ist bereits vorhanden 

lower_case_table_names = 1                  # Windows-Dateisystem ist nicht case-sensitive (Pflichtwert für MySQL auf Windows)

### Speicher & Performance ###
innodb_buffer_pool_size        = 128M         # 50-80% des RAM für InnoDB Caching
innodb_redo_log_capacity       = 100M       # Größe der Redo-Logs (abhängig vom Workload)
innodb_file_per_table          = 1          # Separate Dateien pro Tabelle (.ibd), flexibler bei Backups
innodb_flush_log_at_trx_commit = 1          # Volle ACID-Compliance (2 = schneller, aber weniger sicher)

### Zeichensätze ###
character_set_server = utf8mb4              # Standardzeichensatz (UTF-8 mit Emojis)
collation_server     = utf8mb4_0900_ai_ci   # Moderne Sortierung (empfohlen bei MySQL 8.4)

### Protokollierung ###
log_error                   = "C:/Program Files/MySQL/MySQL Server 8.4/logs/error.log"         # Fehlerprotokoll
slow_query_log              = 1                                                               # Slow Query Log aktivieren
slow_query_log_file         = "C:/Program Files/MySQL/MySQL Server 8.4/logs/mysql-slow.log"    # Pfad für langsame Queries
long_query_time             = 2                                                               # Ab 2s gilt Query als langsam
log_queries_not_using_indexes = 1                                                             # Loggt Queries ohne Index
general_log                 = 0                                                               # General Query Log (nur Debug, nicht in Produktion!)
general_log_file            = "C:/Program Files/MySQL/MySQL Server 8.4/logs/mysql-general.log" # Pfad für General Query Log

### Binäre Logs (Replikation & PITR) ###
log-bin       = "C:/Program Files/MySQL/MySQL Server 8.4/logs/mysql-bin.log"
log-bin-index = "C:/Program Files/MySQL/MySQL Server 8.4/logs/mysql-bin.index"
sync_binlog   = 1                           # Garantierte Konsistenz (Performance-Kosten möglich)
binlog_expire_logs_seconds = 864000         # 10 Tage Aufbewahrung (statt expire_logs_days aus MariaDB)

### TLS/SSL für den Server ###
# ssl-ca   = C:/mysql/ssl/ca-cert.pem       # CA-Zertifikat
# ssl-cert = C:/mysql/ssl/server-cert.pem   # Server-Zertifikat
# ssl-key  = C:/mysql/ssl/server-key.pem    # Privater Schlüssel
# require_secure_transport = ON             # Erzwingt TLS für alle Verbindungen


[mysqldump]
quick                                        # Zeilenweise Export, schneller & speicherschonend
quote-names                                  # Sonderzeichen in Backticks setzen
max_allowed_packet = 64M                     # Erlaubte Paketgröße (für große Dumps notwendig)
